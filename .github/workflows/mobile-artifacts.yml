name: Mobile Artifacts

# Build installable/browsable mobile artifacts on every push to this branch
# and on demand. Unlike the upstream release workflows, this one is
# fork-friendly: no signing secrets, no repository guardrails.

on:
  push:
    branches: [mobile-artifacts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Prime Flutter SDK
        run: flutter --version
      - name: Pub get
        run: cd mobile && flutter pub get
      - name: Prepare env.json (optional file)
        run: |
          cd mobile
          if [ ! -f .env.json ] && [ -f .env.json.example ]; then
            cp .env.json.example .env.json
          fi
      - name: Build debug APK
        run: just mobile-build-android
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Prime Flutter SDK
        run: flutter --version
      - name: Pub get
        run: cd mobile && flutter pub get
      - name: Prepare env.json (optional file)
        run: |
          cd mobile
          if [ ! -f .env.json ] && [ -f .env.json.example ]; then
            cp .env.json.example .env.json
          fi
      - name: Build iOS (unsigned device build)
        run: cd mobile && flutter build ios --no-codesign
      - name: Package Runner.app
        run: |
          cd mobile/build/ios/iphoneos
          zip -qr "$GITHUB_WORKSPACE/runner-app.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-ios-runner-app-unsigned
          path: runner-app.zip
          retention-days: 30
      - name: Build iOS simulator build
        if: always()
        continue-on-error: true
        run: cd mobile && flutter build ios --simulator
      - name: Package simulator app
        if: always()
        continue-on-error: true
        run: |
          cd mobile/build/ios/iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/runner-simulator.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: buzz-ios-simulator-app
          path: runner-simulator.zip
          retention-days: 30
